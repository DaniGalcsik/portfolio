<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="400" height="130" role="img" aria-label="Animated bouncing children silhouettes">
  <style>
    @keyframes bounce-kid1 {
      0%,100% { transform: translateY(0px) scaleY(1); }
      40%      { transform: translateY(-28px) scaleY(1.05); }
      55%      { transform: translateY(-30px) scaleY(1); }
      70%      { transform: translateY(-10px) scaleY(0.97); }
    }
    @keyframes bounce-kid2 {
      0%,100% { transform: translateY(0px) scaleY(1); }
      40%      { transform: translateY(-22px) scaleY(1.05); }
      55%      { transform: translateY(-24px) scaleY(1); }
      70%      { transform: translateY(-8px) scaleY(0.97); }
    }
    @keyframes bounce-kid3 {
      0%,100% { transform: translateY(0px) scaleY(1); }
      40%      { transform: translateY(-32px) scaleY(1.08); }
      55%      { transform: translateY(-34px) scaleY(1); }
      70%      { transform: translateY(-12px) scaleY(0.95); }
    }
    @keyframes sparkle {
      0%,100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
      50%      { opacity: 1; transform: scale(1.2) rotate(180deg); }
    }
    @keyframes wobble-castle {
      0%,100% { transform: rotate(0deg); }
      25%      { transform: rotate(-1.5deg); }
      75%      { transform: rotate(1.5deg); }
    }

    .kid1 { animation: bounce-kid1 0.9s ease-in-out infinite; transform-origin: 80px 100px; }
    .kid2 { animation: bounce-kid2 0.9s ease-in-out 0.15s infinite; transform-origin: 200px 100px; }
    .kid3 { animation: bounce-kid3 0.9s ease-in-out 0.3s infinite; transform-origin: 320px 100px; }
    .star1 { animation: sparkle 1.2s ease-in-out 0.1s infinite; }
    .star2 { animation: sparkle 1.2s ease-in-out 0.5s infinite; }
    .star3 { animation: sparkle 1.2s ease-in-out 0.8s infinite; }
    .star4 { animation: sparkle 1.2s ease-in-out 0.3s infinite; }

    /* Faster bounce on hover card .bouncers-fast */
    .bouncers-fast .kid1 { animation-duration: 0.45s !important; }
    .bouncers-fast .kid2 { animation-duration: 0.45s !important; }
    .bouncers-fast .kid3 { animation-duration: 0.45s !important; }
  </style>

  <!-- Castle silhouette (simple) with wobble -->
  <g style="animation: wobble-castle 2s ease-in-out infinite; transform-origin: 200px 115px;">
    <rect x="155" y="90" width="90" height="25" rx="4" fill="#fbbf24" opacity="0.25"/>
    <rect x="163" y="80" width="18" height="14" rx="2" fill="#fbbf24" opacity="0.3"/>
    <rect x="191" y="80" width="18" height="14" rx="2" fill="#fbbf24" opacity="0.3"/>
    <rect x="219" y="80" width="18" height="14" rx="2" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- Kid 1 — sky blue -->
  <g class="kid1">
    <circle cx="80" cy="68" r="9" fill="#38bdf8"/>
    <rect x="73" y="77" width="14" height="20" rx="3" fill="#38bdf8" opacity="0.9"/>
    <line x1="73" y1="82" x2="58" y2="90" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="87" y1="82" x2="102" y2="90" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="77" y1="97" x2="70" y2="115" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="83" y1="97" x2="90" y2="115" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Kid 2 — yellow -->
  <g class="kid2">
    <circle cx="200" cy="68" r="9" fill="#fbbf24"/>
    <rect x="193" y="77" width="14" height="20" rx="3" fill="#fbbf24" opacity="0.9"/>
    <line x1="193" y1="82" x2="178" y2="86" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="207" y1="82" x2="222" y2="86" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="197" y1="97" x2="190" y2="115" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="203" y1="97" x2="210" y2="115" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Kid 3 — green -->
  <g class="kid3">
    <circle cx="320" cy="68" r="9" fill="#34d399"/>
    <rect x="313" y="77" width="14" height="20" rx="3" fill="#34d399" opacity="0.9"/>
    <line x1="313" y1="82" x2="296" y2="88" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="327" y1="82" x2="344" y2="88" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="317" y1="97" x2="310" y2="115" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="323" y1="97" x2="330" y2="115" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / stars -->
  <text class="star1" x="108" y="55" font-size="14" fill="#fbbf24">★</text>
  <text class="star2" x="40"  y="72" font-size="10" fill="#f0abfc">✦</text>
  <text class="star3" x="348" y="60" font-size="12" fill="#38bdf8">★</text>
  <text class="star4" x="248" y="52" font-size="10" fill="#fbbf24">✦</text>
</svg>
